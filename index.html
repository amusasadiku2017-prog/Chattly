<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#020b08">
<title>CHATTLY</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="authScreen">

    <div class="auth-logo">C</div>
    <h1>CHATTLY <span>✓</span></h1>
    <p>Connect • Chat • Create</p>

    <div class="auth-card">

        <div id="registerFields">
            <input id="displayName" placeholder="Your full name">
            <input id="username" placeholder="Choose a username">
        </div>

        <input id="email" type="email" placeholder="Email address">
        <input id="password" type="password" placeholder="Password">

        <button id="authButton" onclick="authenticate()">
            Create Account
        </button>

        <p id="authMessage"></p>

        <p class="switch">
            <span id="switchText">Already have an account?</span>
            <a onclick="toggleAuth()" id="switchButton">Login</a>
        </p>

    </div>
</div>


<div id="app" class="hidden">

<header>
    <div class="brand">
        <div class="logo">C</div>
        <div>
            <h2>CHATTLY <span>✓</span></h2>
            <small>Different by design.</small>
        </div>
    </div>

    <button onclick="logout()">↪</button>
</header>


<main>

<section id="home">

    <h2>Messages</h2>
    <p id="welcome"></p>

    <input
        id="userSearch"
        placeholder="Search username..."
        oninput="searchUsers()"
    >

    <div id="searchResults"></div>

    <h3>Your conversations</h3>

    <div id="chatList">
        <p class="muted">Your conversations will appear here.</p>
    </div>

</section>


<section id="conversation" class="hidden">

    <div class="chat-header">
        <button onclick="backHome()">←</button>
        <div>
            <h3 id="chatName">Conversation</h3>
            <small>Private conversation</small>
        </div>
    </div>

    <div id="messages"></div>

    <div class="message-input">
        <input id="messageInput" placeholder="Write a message...">
        <button onclick="sendMessage()">➤</button>
    </div>

</section>

</main>


<nav>
    <button onclick="backHome()">▤<small>Chats</small></button>
    <button onclick="showComingSoon('Updates')">◉<small>Updates</small></button>
    <button onclick="showComingSoon('Communities')">♧<small>Communities</small></button>
    <button onclick="showComingSoon('My Space')">✦<small>My Space</small></button>
</nav>

</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script src="script.js"></script>

</body>
    </html>
